# ------------------------------------------------------------
# MotoVida - FastAPI app
# Domínio: motovida.syntratech.com.br
# Backend Docker: motovida-app:8000 na rede motovida_default
# SSL: Let's Encrypt cert-name npm-105-motovida
# ------------------------------------------------------------

server {
  listen 80;
  listen [::]:80;

  server_name motovida.syntratech.com.br;

  include conf.d/include/letsencrypt-acme-challenge.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name motovida.syntratech.com.br;

  http2 on;

  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-105-motovida/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-105-motovida/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;

  access_log /data/logs/proxy-host-motovida_access.log proxy;
  error_log /data/logs/proxy-host-motovida_error.log warn;

  include conf.d/include/block-exploits.conf;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass http://motovida-app:8000;
  }
}
