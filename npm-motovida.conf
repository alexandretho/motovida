# ------------------------------------------------------------
# MotoVida - FastAPI app
# Domínio: motovida.syntratech.com.br
# Backend Docker: motovida-app:8000 na rede motovida_default
# SSL: Let's Encrypt cert-name npm-105-motovida
# ------------------------------------------------------------

server {
  listen 80;
  listen [::]:80;

  server_name motovida.syntratech.com.br;

  include conf.d/include/letsencrypt-acme-challenge.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name motovida.syntratech.com.br;

  http2 on;

  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-105-motovida/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-105-motovida/privkey.pem;

  # IP real do visitante via Cloudflare (ranges de https://www.cloudflare.com/ips/)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  add_header Strict-Transport-Security "max-age=31536000" always;

  access_log /data/logs/proxy-host-motovida_access.log proxy;
  error_log /data/logs/proxy-host-motovida_error.log warn;

  include conf.d/include/block-exploits.conf;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass http://motovida-app:8000;
  }
}
