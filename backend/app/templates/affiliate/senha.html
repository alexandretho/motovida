{% extends "base.html" %}
{% block title %}Alterar senha – Instituto MotoVida{% endblock %}
{% block robots_meta %}noindex, nofollow{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <h1>Alterar senha</h1>
    <p class="section-sub">Use uma senha forte e exclusiva para reduzir o risco de acesso indevido à sua conta.</p>

    <form class="card form" method="post" action="/afiliado/senha" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label>Senha atual
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>
      <label>Nova senha
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
      </label>
      <label>Confirmar nova senha
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </label>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Atualizar senha</button>
        <a class="btn btn-ghost" href="/afiliado/perfil">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
