{% extends "base.html" %}
{% block title %}Meu Perfil – Instituto MotoVida{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <h1>Meu Perfil</h1>
    <p class="section-sub">Mantenha seus dados de contato e apoio atualizados.</p>
    <form class="card form" method="post" action="/afiliado/perfil">
      <label>Nome completo *<input name="full_name" required maxlength="180" value="{{ aff.full_name }}"></label>
      <div class="form-row">
        <label>CPF<input value="{{ cpf_format }}" readonly></label>
        <label>E-mail<input type="email" value="{{ aff.email }}" readonly></label>
      </div>
      <div class="form-row">
        <label>Telefone *<input name="phone" required maxlength="20" value="{{ aff.phone }}"></label>
        <label>WhatsApp *<input name="whatsapp" required maxlength="20" value="{{ aff.whatsapp }}"></label>
      </div>
      <div class="form-row">
        <label>Cidade *<input name="city" required maxlength="120" value="{{ aff.city }}"></label>
        <label>Estado (UF) *
          <select name="state" required>
            <option value="">Selecione</option>
            {% for uf in ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'] %}
            <option value="{{ uf }}" {{ 'selected' if aff.state == uf }}>{{ uf }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-row">
        <label>Profissão *
          <select name="profession" required>
            <option value="">Selecione</option>
            {% for k, v in L.professions.items() %}<option value="{{ k }}" {{ 'selected' if aff.profession == k }}>{{ v }}</option>{% endfor %}
          </select>
        </label>
        <label>Situação do MEI *
          <select name="mei_status" required>
            <option value="">Selecione</option>
            {% for k, v in L.mei.items() %}<option value="{{ k }}" {{ 'selected' if aff.mei_status == k }}>{{ v }}</option>{% endfor %}
          </select>
        </label>
      </div>
      <label>Necessidades de apoio<textarea name="support_needs" rows="4">{{ aff.support_needs or '' }}</textarea></label>
      <button class="btn btn-primary btn-lg" type="submit">Salvar perfil</button>
    </form>
  </div>
</section>
{% endblock %}
