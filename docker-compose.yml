services:
  mysql:
    image: mysql:8.0
    container_name: motovida-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gere-uma-senha-forte-para-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-motovida}
      MYSQL_USER: ${MYSQL_USER:-motovida}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gere-uma-senha-forte-para-o-banco}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-gere-uma-senha-forte-para-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: ./backend
    container_name: motovida-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-motovida}
      MYSQL_USER: ${MYSQL_USER:-motovida}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gere-uma-senha-forte-para-o-banco}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SITE_URL: ${SITE_URL:-https://motovida.syntratech.com.br}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-G-VHCJDB0QNS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.invalid}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-change-me}
    expose:
      - "8000"
    ports:
      # Acesso privado via Tailscale; não expor app direto na internet pública.
      - "100.74.78.59:9205:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: motovida-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - default      # alcança motovida-app
      - npm_shared   # alcança apps de outros projetos

networks:
  default:
  npm_shared:
    external: true

volumes:
  mysql_data:
  npm_data:
  npm_letsencrypt:
